name: iOS Release Fast

# 快速发布档：Release 编译 + 打包 + 发布到 Seal-Releases。
# 与完整 ios.yml 的区别：跳过模拟器 UI 回归与 signer-tests 测试门，
# 用于「只改了 Swift 业务逻辑、没动 Rust 桥/签名器」的小版本快速出包。
# 大改动（签名器、RustBridge、安装链路）仍须走完整 iOS workflow。
# ⚠️ 2026-09-19：`rork-sign-tests` 已改名为 `signer-tests`（测 `CodeSignKit` + `SideSign` ✓）。
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "显式发布到更新通道（未勾选时仅构建验证，不发布）"
        type: boolean
        default: false
      release_tag:
        description: "Release 标签（留空则自动 v<版本>，须与 MARKETING_VERSION 对齐）"
        type: string
        default: ""
      prerelease:
        description: "标记为预发布版本"
        type: boolean
        default: false

concurrency:
  group: ios-release-fast-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-release:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Check release safety invariants
        run: python3 Scripts/verify-release-safety.py

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/Seal-*/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Cache Rust toolchain and cargo artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry
            ~/.cargo/git
            Vendor/Minimuxer/RustBridge/target
            Vendor/Minimuxer/RustBridge/lib/RustBridge.xcframework
          key: rustbridge-${{ runner.os }}-${{ hashFiles('Vendor/Minimuxer/RustBridge/Cargo.lock', 'Vendor/Minimuxer/RustBridge/Cargo.toml', 'Vendor/Minimuxer/RustBridge/Makefile', 'Vendor/Minimuxer/RustBridge/src/**') }}
          restore-keys: |
            rustbridge-${{ runner.os }}-

      - name: Select pinned Xcode 26.5
        run: |
          test -d /Applications/Xcode_26.5.app
          sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version
          test "$(xcodebuild -version | head -n 1)" = "Xcode 26.5"

      - name: Audit vendored RustBridge FFI source
        run: bash Scripts/audit-rustbridge-source.sh

      - name: Ensure RustBridge matches Rust source
        env:
          RUST_TOOLCHAIN: 1.97.1
        run: bash Scripts/ensure-rustbridge.sh

      - name: Verify vendored RustBridge is present
        run: |
          test -f Vendor/Minimuxer/RustBridge/lib/RustBridge.xcframework/ios-arm64/librust_bridge.a
          test -f Vendor/Minimuxer/RustBridge/lib/RustBridge.xcframework/ios-arm64-simulator/librust_bridge.a

      - name: Install pinned XcodeGen
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.45.4/xcodegen.zip
          echo "090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          ditto -x -k "$RUNNER_TEMP/xcodegen.zip" "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify Seal minimum deployment target remains iOS 16
        run: |
          TARGET="$(xcodebuild \
            -project Seal.xcodeproj \
            -target Seal \
            -configuration Debug \
            -sdk iphonesimulator \
            -showBuildSettings | awk -F ' = ' '/^[[:space:]]*IPHONEOS_DEPLOYMENT_TARGET = / { print $2; exit }')"
          echo "Seal IPHONEOS_DEPLOYMENT_TARGET=$TARGET"
          # ⚠️ 与 Config/Base.xcconfig 的 IPHONEOS_DEPLOYMENT_TARGET 必须一致；
          # 三份 workflow（ios / ios-fast / ios-release）各有一处同样的断言，改一处要三处同改。
          test "$TARGET" = "16.0"

      - name: Refresh local SPM binary artifacts (避免缓存旧版 RustBridge 静态库)
        run: |
          # 只清源码 checkouts，保留 artifacts/（OpenSSL.xcframework 等二进制包）。
          rm -rf build/DerivedData/SourcePackages/checkouts

      - name: Build Release unsigned IPA
        run: SEAL_IPA_CONFIGURATION=Release SEAL_SKIP_XCODEGEN=1 bash Scripts/build-unsigned-ipa.sh

      - name: Verify unsigned IPA
        run: bash Scripts/verify-ipa.sh build/Seal_*.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Seal-${{ github.run_number }}
          if-no-files-found: error
          path: |
            build/Seal_*.ipa
            build/Seal_*.ipa.sha256
            build/Seal-Info.plist
          retention-days: 30

  publish-release:
    needs: [build-release]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Download unsigned IPA artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Seal-${{ github.run_number }}
          path: release

      - name: Publish GitHub Release via gh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          INPUT_TAG: ${{ inputs.release_tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          ls -la release
          VER="$(python3 -c "import plistlib;print(plistlib.load(open('release/Seal-Info.plist','rb'))['CFBundleShortVersionString'])")"
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then TAG="v${VER}"; fi
          if [ "${TAG#v}" != "$VER" ]; then
            echo "Release tag must match the IPA marketing version" >&2
            exit 1
          fi
          # 发布正文唯一来源。缺文件时 `cat` 只会留下一行 "No such file or directory"，
          # 看不出是文档被删了还是 checkout 出问题 —— 显式判空并给出可执行的下一步。
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::RELEASE_NOTES.md 缺失或为空：它是发布正文唯一来源（见 AGENTS.md「版本与发布」）。补写本次版本正文后重跑本 job。"
            exit 1
          fi
          # ⚠️ **只取「第一个 `# 版本：…` 标题」那一节**（2026-09-20 修）✗ ——
          # 原来是 `cat` **整个文件** ✗ ⇒ **更新弹窗会把所有历史版本全列出来**
          #（实测 74 行 / 5 个版本 ✗），而且旧版本文案里带 `installation_proxy` / `installd`
          # 这类**内部术语** ✗✗ —— 那是给开发者看的，不该出现在用户弹窗里 ✓。
          # 判据：`RELEASE_NOTES.md` **最新的版本必须写在文件最上面** ✓（守卫钉住 ✓）。
          NOTES="$(awk '/^# /{ if (found) exit; found=1 } found' RELEASE_NOTES.md \
            | sed -e '/^---[[:space:]]*$/d' -e 's/[[:space:]]*$//' | cat -s)"
          ARGS=(--title "Seal $TAG" --notes "$NOTES")
          if [ "$PRERELEASE" = "true" ]; then ARGS+=(--prerelease); fi
          # 跨仓库发布不传 --target：源仓库 SHA 在 Seal-Releases 不存在，
          # 传了会 422（target_commitish invalid），默认指向目标仓库 main。
          gh release create "$TAG" "${ARGS[@]}" --repo sunuannian1/Seal-Releases \
            release/Seal_*.ipa \
            release/Seal_*.ipa.sha256 \
            release/Seal-Info.plist
          echo "published $TAG"
