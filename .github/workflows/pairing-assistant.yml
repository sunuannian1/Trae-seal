name: Seal Pairing Assistant

on:
  workflow_dispatch:
    inputs:
      full_check:
        description: "Run cargo test release gate. Slower, for final verification only."
        required: false
        default: "false"
        type: boolean
  push:
    branches: [main, "feature/**"]
    paths:
      - "Tools/SealPairingAssistant/**"
      - "Seal/Features/Settings/SettingsViewModel.swift"
      - "Seal/Features/Settings/PairingSettingsView.swift"
      - "Seal/Infrastructure/Pairing/PairingStore.swift"
      - ".github/workflows/pairing-assistant.yml"

concurrency:
  group: pairing-assistant-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      UPSTREAM_REPOSITORY: jkcoxson/idevice_pair
      UPSTREAM_COMMIT: e3abb341b73a4fbeb96cdfc5e6652687e4bee130
      RUST_TOOLCHAIN: 1.97.1

    steps:
      - name: Checkout Seal integration
        uses: actions/checkout@v6.0.2

      - name: Checkout pinned upstream idevice_pair
        uses: actions/checkout@v6.0.2
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ env.UPSTREAM_COMMIT }}
          path: upstream/idevice_pair
          persist-credentials: false

      - name: Verify pinned upstream revision
        shell: pwsh
        run: |
          $actual = git -C upstream/idevice_pair rev-parse HEAD
          if ($actual -ne "${env:UPSTREAM_COMMIT}") { throw "Unexpected upstream commit: $actual" }
          $cargo = Get-Content upstream/idevice_pair/Cargo.toml -Raw
          if ($cargo -notmatch 'version = "0\.1\.14"') { throw "Unexpected idevice_pair version" }
          New-Item -ItemType Directory -Force -Path build | Out-Null
          Copy-Item upstream/idevice_pair/Cargo.lock build/idevice_pair-Cargo.lock.upstream

      - name: Stage Seal application icon
        shell: pwsh
        run: |
          & Tools/SealPairingAssistant/stage_icon.ps1 `
            -Source "Tools/SealPairingAssistant/assets/seal_icon.png" `
            -UpstreamRoot "upstream/idevice_pair"
          $buildScript = Get-Content upstream/idevice_pair/build.rs -Raw
          if (-not $buildScript.Contains('res.set_icon("icon.ico")')) {
            throw "Pinned upstream no longer embeds icon.ico into the Windows executable"
          }

      - name: Apply Seal overlay
        shell: pwsh
        run: python Tools/SealPairingAssistant/patch_upstream.py upstream/idevice_pair

      - name: Install pinned Rust
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --component rustfmt
          rustup default $env:RUST_TOOLCHAIN
          rustc --version --verbose
          cargo --version

      - name: Cache Rust dependencies and target
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            upstream/idevice_pair/target
          key: seal-pairing-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ env.UPSTREAM_COMMIT }}-${{ hashFiles('upstream/idevice_pair/Cargo.lock', 'Tools/SealPairingAssistant/**') }}
          restore-keys: |
            seal-pairing-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ env.UPSTREAM_COMMIT }}-
            seal-pairing-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-

      - name: Normalize and verify Rust format
        working-directory: upstream/idevice_pair
        run: |
          cargo fmt --all
          cargo fmt --all -- --check

      - name: Normalize overlay lock metadata
        working-directory: upstream/idevice_pair
        run: cargo check --release

      - name: Verify dependency lock did not drift
        shell: pwsh
        run: |
          @'
          import collections
          import pathlib
          import tomllib

          original = tomllib.loads(pathlib.Path("build/idevice_pair-Cargo.lock.upstream").read_text(encoding="utf-8"))
          current = tomllib.loads(pathlib.Path("upstream/idevice_pair/Cargo.lock").read_text(encoding="utf-8"))

          def packages(lock):
              return lock.get("package", [])

          def root(lock):
              matches = [p for p in packages(lock) if p.get("name") == "idevice_pair"]
              if len(matches) != 1:
                  raise SystemExit(f"Expected one idevice_pair root package, found {len(matches)}")
              return matches[0]

          def identity(p):
              return (
                  p.get("name"),
                  p.get("version"),
                  p.get("source"),
                  p.get("checksum"),
              )

          original_root = root(original)
          current_root = root(current)

          if current_root.get("version") != "0.1.14":
              raise SystemExit(f"Unexpected overlaid root version: {current_root.get('version')}")
          if "raw-window-handle" not in current_root.get("dependencies", []):
              raise SystemExit("raw-window-handle was not recorded in root lock metadata")

          original_third_party = collections.Counter(
              identity(p) for p in packages(original) if p.get("name") != "idevice_pair"
          )
          current_third_party = collections.Counter(
              identity(p) for p in packages(current) if p.get("name") != "idevice_pair"
          )
          if original_third_party != current_third_party:
              raise SystemExit("Third-party dependency versions changed while normalizing Cargo.lock")

          print(
              "Cargo.lock normalized without third-party dependency drift: "
              f"{original_root.get('version')} -> {current_root.get('version')}"
          )
          '@ | python -

      - name: Rust test gate
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.full_check == 'true' }}
        working-directory: upstream/idevice_pair
        run: cargo test --release --locked

      - name: Build Windows x64 release
        working-directory: upstream/idevice_pair
        run: cargo build --release --locked

      - name: Verify upstream feature surface
        shell: pwsh
        run: |
          $source = Get-Content upstream/idevice_pair/src/main.rs -Raw
          $required = @(
            'IdeviceCommands::EnableWireless',
            'IdeviceCommands::CheckDevMode',
            'IdeviceCommands::AutoMount',
            'IdeviceCommands::GeneratePairingFile',
            'IdeviceCommands::ValidateRemote',
            'IdeviceCommands::InstallPairingFile',
            'PairingMode::Lockdown',
            'PairingMode::RemotePairing',
            'SealPairing.mobiledevicepairing',
            'fn setup_windows_backdrop',
            'DWMSBT_TRANSIENTWINDOW',
            'pending_seal_install',
            'seal_icon_texture',
            'phone_texture',
            'include_bytes!("seal_assets/seal_icon_ui.rgba")',
            'include_bytes!("seal_assets/iphone_model.rgba")',
            'install_pairing_file_to_seal_if_ready',
            '生成并写入 Seal',
            '已写入 Seal',
            '未连接 iPhone',
            'with_decorations(false)',
            'ViewportCommand::Close',
            '✦  生成并写入 Seal',
            # 2026-09-20：配对类型按设备版本分流（iOS 17.4 以下 ⇒ Lockdown）。
            # 这 4 条与 patch_upstream.py 的 verify() 是**两道互相独立**的闸门 ——
            # 只留 patch 那一道，就会出现「判据与实现一起被改掉、自洽了就算过」✗
            # （R60b 的教训）。放在这里的是「外部」那一道。
            'fn seal_ios_supports_remote_pairing',
            'fn seal_mode_for_ios',
            'seal_lockdown_only',
            'seal_mode_for_ios(&ios_version, self.pairing_mode)',
            'let has_ios_version = ios_version != "—";',
            'has_device && has_ios_version && !is_processing',
            '正在读取 iOS 版本…',
            # 2026-09-21：最低支持版本回到 iOS 16 ⇒ 助手对 16.x 必须走 Lockdown 并照常生成。
            # ⚠️ 这两条与 `patch_upstream.py` 的 `verify()` 是**两道互相独立**的闸门 ——
            # 只留那一道，就会出现「判据与实现一起被改掉、自洽了就算过」✗（R60b 的教训）。
            # 放在这里的是「外部」那一道。
            # ⚠️ 本清单跑在 `cargo fmt --all` **之后** ⇒ 只加**短片段**，
            # 长表达式被 rustfmt 折行会误判为缺失 ⇒ 白烧一轮 CI ✗。
            # 这两条分别约 42 / 54 字符，远低于 max_width = 100 ✓。
            'seal_ios_supports_remote_pairing("16.0")',
            'seal_mode_for_ios("16.0", PairingMode::RemotePairing)'
          )
          foreach ($marker in $required) {
            if (-not $source.Contains($marker)) { throw "Required feature missing: $marker" }
          }
          if ($source.Contains('RichText::new(&pairing_file).monospace()')) {
            throw "Raw pairing material is still rendered in the UI"
          }
          if ($source.Contains('if let Some(pairing_file) = pairing_file_text')) {
            throw "Seal overlay left an unused pairing-file binding"
          }
          $removed = @(
            'seal_lang_selector',
            'seal_view_logs',
            'seal_pairing_ready',
            'seal_pairing_mode',
            '写入已安装应用'
          )
          foreach ($marker in $removed) {
            if ($source.Contains($marker)) { throw "Removed minimal UI surface is still visible: $marker" }
          }
          if (-not (Test-Path upstream/idevice_pair/icon.png)) {
            throw "Seal runtime icon is missing"
          }
          if (-not (Test-Path upstream/idevice_pair/icon.ico)) {
            throw "Seal Windows resource icon is missing"
          }
          if (-not (Test-Path upstream/idevice_pair/src/seal_assets/seal_icon_ui.rgba)) {
            throw "Seal UI icon raw asset is missing"
          }
          if (-not (Test-Path upstream/idevice_pair/src/seal_assets/iphone_model.rgba)) {
            throw "Seal iPhone model raw asset is missing"
          }

      - name: Verify Windows PE
        shell: pwsh
        run: |
          $exe = Resolve-Path upstream/idevice_pair/target/release/idevice_pair.exe
          $bytes = [IO.File]::ReadAllBytes($exe)
          if ($bytes.Length -lt 1024) { throw "Executable is unexpectedly small" }
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Missing MZ header" }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          if ([Text.Encoding]::ASCII.GetString($bytes, $peOffset, 4) -ne "PE`0`0") { throw "Invalid PE signature" }

      - name: Package artifact
        shell: pwsh
        run: |
          $out = Join-Path $PWD "build/Seal-Pairing-Assistant-Windows-x64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item upstream/idevice_pair/target/release/idevice_pair.exe (Join-Path $out "Seal配对助手.exe")
          $upstreamReadme = "upstream/idevice_pair/README.md"
          $upstreamReadmeText = Get-Content $upstreamReadme -Raw
          if ($upstreamReadmeText -notmatch '(?ms)^## License\s+.*MIT License') { throw "Pinned upstream license declaration changed" }
          Copy-Item $upstreamReadme (Join-Path $out "UPSTREAM-README.md")
          Copy-Item Tools/SealPairingAssistant/UPSTREAM.md (Join-Path $out "UPSTREAM.md")
          @"
          Seal Pairing Assistant
          Upstream: ${env:UPSTREAM_REPOSITORY}
          Commit: ${env:UPSTREAM_COMMIT}
          Rust: ${env:RUST_TOOLCHAIN}
          Target: Windows x64
          Icon: bundled Seal icon asset
          UI: Seal v13 1:1 glass pairing assistant

          Windows prerequisite:
          Install Apple website iTunes / Apple Mobile Device support as required by upstream idevice_pair.
          "@ | Set-Content (Join-Path $out "README.txt") -Encoding UTF8
          # ⚠️ 必须 UTF8，**不能用 ASCII 编码**（2026-09-20 修）：PowerShell 的 ASCII 编码
          # 会把所有非 ASCII 字符**替换成 ?** ⇒ 清单里的文件名变成 Seal????.exe，
          # 用户 sha256sum -c SHA256SUMS.txt 直接报「没有那个文件」✗
          # （哈希本身是对的，所以这个错很难被发现 —— 只有真去 -c 才暴露）。
          # 本步骤 shell 是 pwsh（PS 7）⇒ UTF8 写出来是**无 BOM** 的 ✓
          # （PS 5.1 的 UTF8 会带 BOM，那会同样让 -c 失败）。
          # ⚠️ 但**光修编码不够**：`Set-Content` 在 Windows 上固定用 CRLF 行尾 ✗
          # ⇒ 用户 sha256sum -c 报 `'Seal配对助手.exe'$'\r': No such file or directory`
          # （⚠️ 哈希仍是对的 ⇒ 只有真去 -c 才暴露。2026-09-21 实测复现：
          #  下载 run 35553633932 的产物，清单尾部是 \r\n，-c 直接失败）。
          # ⇒ 改用 WriteAllText + UTF8Encoding($false)：行尾由我们指定为 LF、且无 BOM ✓
          # （纯 .NET API，PS 5.1 / 7 行为一致）。
          $sum = (Get-FileHash (Join-Path $out "Seal配对助手.exe") -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText(
            (Join-Path $out "SHA256SUMS.txt"),
            "$sum  Seal配对助手.exe`n",
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Upload Windows pairing assistant
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Seal-Pairing-Assistant-Windows-x64
          path: build/Seal-Pairing-Assistant-Windows-x64
          if-no-files-found: error
          retention-days: 30
